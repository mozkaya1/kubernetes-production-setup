input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs if your Go microservices output JSON
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "kubernetes-microservices-%{+YYYY.MM.dd}"
  }
