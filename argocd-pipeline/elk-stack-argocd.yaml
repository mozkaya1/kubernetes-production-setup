apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk-stack-argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mozkaya1/kubernetes-production-setup.git
    targetRevision: HEAD
    path: ELK-Stack
  
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:

      selfHeal: true
      prune: true

    syncOptions:
      - ServerSideApply=true
#      - CreateNamespace=true
    


